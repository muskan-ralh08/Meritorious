<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #87CEEB, #1E90FF);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 80vh;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }
        
        #gameCanvas {
            background: linear-gradient(to bottom, #2c3e50, #4a6491);
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .coins-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: auto;
        }
        
        .control-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .control-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.5);
        }
        
        .start-screen, .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10;
        }
        
        .game-over-screen {
            display: none;
        }
        
        h1 {
            font-size: 40px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            color: #FFD700;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #FF5722;
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
            pointer-events: auto;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .instructions {
            text-align: center;
            max-width: 80%;
            margin-top: 20px;
            line-height: 1.5;
        }
        
        .lane-indicator {
            position: absolute;
            bottom: 120px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .lane-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
        }
        
        .lane-dot.active {
            background: #FFD700;
            transform: scale(1.3);
        }
        
        @media (max-width: 500px) {
            .control-btn {
                width: 70px;
                height: 70px;
            }
            
            h1 {
                font-size: 32px;
            }
            
            .btn {
                padding: 12px 25px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-overlay">
            <div class="score-display">Score: <span id="score">0</span></div>
            <div class="coins-display">Coins: <span id="coins">0</span></div>
            
            <div class="lane-indicator">
                <div class="lane-dot" data-lane="0"></div>
                <div class="lane-dot" data-lane="1"></div>
                <div class="lane-dot" data-lane="2"></div>
            </div>
            
            <div class="controls">
                <div class="control-btn" id="leftBtn">←</div>
                <div class="control-btn" id="jumpBtn">↑</div>
                <div class="control-btn" id="rightBtn">→</div>
            </div>
        </div>
        
        <div class="start-screen" id="startScreen">
            <h1>SUBWAY RUNNER</h1>
            <p class="instructions">Avoid obstacles, collect coins, and get the highest score!</p>
            <button class="btn" id="startBtn">START GAME</button>
        </div>
        
        <div class="game-over-screen" id="gameOverScreen">
            <h1>GAME OVER</h1>
            <p>Your Score: <span id="finalScore">0</span></p>
            <p>Coins Collected: <span id="finalCoins">0</span></p>
            <button class="btn" id="restartBtn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const coinsDisplay = document.getElementById('coins');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');
        const finalCoins = document.getElementById('finalCoins');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const jumpBtn = document.getElementById('jumpBtn');
        const laneDots = document.querySelectorAll('.lane-dot');
        
        // Set canvas size
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Game state
        let game = {
            running: false,
            score: 0,
            coins: 0,
            speed: 5,
            lanes: [canvas.width * 0.25, canvas.width * 0.5, canvas.width * 0.75],
            currentLane: 1, // Middle lane
            obstacles: [],
            coinsList: [],
            lastObstacleTime: 0,
            lastCoinTime: 0,
            obstacleInterval: 1500, // ms
            coinInterval: 1000, // ms
            gravity: 0.5,
            isJumping: false,
            jumpVelocity: 0,
            jumpPower: 15,
            groundLevel: canvas.height * 0.7
        };
        
        // Player character
        const player = {
            width: 40,
            height: 60,
            x: game.lanes[game.currentLane] - 20,
            y: game.groundLevel - 60,
            color: '#3498db'
        };
        
        // Obstacle class
        class Obstacle {
            constructor(lane) {
                this.width = 40;
                this.height = 60;
                this.x = game.lanes[lane] - this.width/2;
                this.y = canvas.height;
                this.speed = game.speed;
                this.color = '#e74c3c';
                this.lane = lane;
            }
            
            update() {
                this.y -= this.speed;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                
                // Add some details to the obstacle
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(this.x + 5, this.y + 5, this.width - 10, this.height - 10);
            }
            
            isOffScreen() {
                return this.y < -this.height;
            }
        }
        
        // Coin class
        class Coin {
            constructor(lane) {
                this.radius = 15;
                this.x = game.lanes[lane];
                this.y = canvas.height;
                this.speed = game.speed;
                this.color = '#FFD700';
                this.lane = lane;
                this.collected = false;
            }
            
            update() {
                this.y -= this.speed;
            }
            
            draw() {
                if (this.collected) return;
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Add shine effect
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y - 5, this.radius / 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            isOffScreen() {
                return this.y < -this.radius * 2;
            }
        }
        
        // Draw background elements
        function drawBackground() {
            // Draw tracks
            ctx.fillStyle = '#333';
            ctx.fillRect(0, game.groundLevel, canvas.width, canvas.height - game.groundLevel);
            
            // Draw lane dividers
            ctx.strokeStyle = '#FFF';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 15]);
            
            for (let i = 1; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(game.lanes[i] - game.lanes[0], game.groundLevel);
                ctx.lineTo(game.lanes[i] - game.lanes[0], canvas.height);
                ctx.stroke();
            }
            
            ctx.setLineDash([]);
            
            // Draw some background buildings
            ctx.fillStyle = '#34495e';
            for (let i = 0; i < 5; i++) {
                const buildingWidth = canvas.width / 8;
                const buildingHeight = Math.random() * 100 + 50;
                ctx.fillRect(i * buildingWidth * 1.5, game.groundLevel - buildingHeight, buildingWidth, buildingHeight);
            }
        }
        
        // Draw player
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Draw player details
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(player.x + 5, player.y + 5, player.width - 10, player.height - 10);
            
            // Draw face
            ctx.fillStyle = '#FFF';
            ctx.fillRect(player.x + 10, player.y + 15, 8, 8); // Left eye
            ctx.fillRect(player.x + player.width - 18, player.y + 15, 8, 8); // Right eye
            ctx.fillRect(player.x + 12, player.y + 35, player.width - 24, 5); // Mouth
        }
        
        // Update player position based on current lane
        function updatePlayerPosition() {
            const targetX = game.lanes[game.currentLane] - player.width/2;
            player.x += (targetX - player.x) * 0.2; // Smooth movement
            
            // Update lane indicator
            laneDots.forEach((dot, index) => {
                if (index === game.currentLane) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }
        
        // Handle jumping physics
        function updateJump() {
            if (game.isJumping) {
                player.y -= game.jumpVelocity;
                game.jumpVelocity -= game.gravity;
                
                if (player.y >= game.groundLevel - player.height) {
                    player.y = game.groundLevel - player.height;
                    game.isJumping = false;
                    game.jumpVelocity = 0;
                }
            }
        }
        
        // Check collisions
        function checkCollisions() {
            // Check obstacle collisions
            for (let obstacle of game.obstacles) {
                if (
                    player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y
                ) {
                    endGame();
                    return;
                }
            }
            
            // Check coin collisions
            for (let coin of game.coinsList) {
                if (!coin.collected && 
                    Math.sqrt((player.x + player.width/2 - coin.x) ** 2 + (player.y + player.height/2 - coin.y) ** 2) < 
                    player.width/2 + coin.radius) {
                    coin.collected = true;
                    game.coins++;
                    coinsDisplay.textContent = game.coins;
                }
            }
        }
        
        // Spawn obstacles
        function spawnObstacle() {
            const currentTime = Date.now();
            if (currentTime - game.lastObstacleTime > game.obstacleInterval) {
                const lane = Math.floor(Math.random() * 3);
                game.obstacles.push(new Obstacle(lane));
                game.lastObstacleTime = currentTime;
                
                // Gradually increase difficulty
                game.obstacleInterval = Math.max(500, game.obstacleInterval - 10);
                game.speed = Math.min(15, game.speed + 0.01);
            }
        }
        
        // Spawn coins
        function spawnCoin() {
            const currentTime = Date.now();
            if (currentTime - game.lastCoinTime > game.coinInterval) {
                const lane = Math.floor(Math.random() * 3);
                game.coinsList.push(new Coin(lane));
                game.lastCoinTime = currentTime;
            }
        }
        
        // Update game objects
        function updateGameObjects() {
            // Update obstacles
            game.obstacles = game.obstacles.filter(obstacle => {
                obstacle.update();
                obstacle.draw();
                return !obstacle.isOffScreen();
            });
            
            // Update coins
            game.coinsList = game.coinsList.filter(coin => {
                coin.update();
                coin.draw();
                return !coin.isOffScreen() && !coin.collected;
            });
        }
        
        // Game loop
        function gameLoop() {
            if (!game.running) return;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            drawBackground();
            
            // Update and draw game objects
            updateGameObjects();
            
            // Update player
            updatePlayerPosition();
            updateJump();
            drawPlayer();
            
            // Spawn new objects
            spawnObstacle();
            spawnCoin();
            
            // Check collisions
            checkCollisions();
            
            // Update score
            game.score += 1;
            scoreDisplay.textContent = game.score;
            
            // Continue game loop
            requestAnimationFrame(gameLoop);
        }
        
        // Start game
        function startGame() {
            game = {
                running: true,
                score: 0,
                coins: 0,
                speed: 5,
                lanes: [canvas.width * 0.25, canvas.width * 0.5, canvas.width * 0.75],
                currentLane: 1,
                obstacles: [],
                coinsList: [],
                lastObstacleTime: Date.now(),
                lastCoinTime: Date.now(),
                obstacleInterval: 1500,
                coinInterval: 1000,
                gravity: 0.5,
                isJumping: false,
                jumpVelocity: 0,
                jumpPower: 15,
                groundLevel: canvas.height * 0.7
            };
            
            player.x = game.lanes[game.currentLane] - player.width/2;
            player.y = game.groundLevel - player.height;
            
            scoreDisplay.textContent = '0';
            coinsDisplay.textContent = '0';
            
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            gameLoop();
        }
        
        // End game
        function endGame() {
            game.running = false;
            finalScore.textContent = game.score;
            finalCoins.textContent = game.coins;
            gameOverScreen.style.display = 'flex';
        }
        
        // Event listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        
        // Touch controls
        leftBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (game.currentLane > 0) {
                game.currentLane--;
            }
        });
        
        rightBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (game.currentLane < 2) {
                game.currentLane++;
            }
        });
        
        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!game.isJumping) {
                game.isJumping = true;
                game.jumpVelocity = game.jumpPower;
            }
        });
        
        // Keyboard controls for testing
        document.addEventListener('keydown', (e) => {
            if (!game.running) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    if (game.currentLane > 0) game.currentLane--;
                    break;
                case 'ArrowRight':
                    if (game.currentLane < 2) game.currentLane++;
                    break;
                case 'ArrowUp':
                case ' ':
                    if (!game.isJumping) {
                        game.isJumping = true;
                        game.jumpVelocity = game.jumpPower;
                    }
                    break;
            }
        });
        
        // Prevent default touch behaviors
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
